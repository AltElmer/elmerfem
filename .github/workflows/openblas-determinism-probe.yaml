name: openblas-determinism-probe

# Experiment for ElmerCSC/elmerfem#901, third attempt.
#
# Where this stands: OpenBLAS threading is refuted. Thirty runs across idle,
# loaded, pinned and unpinned all produced 1.57936883E+03 to every digit.
#
# But that value matches neither number seen in CI (1.57922266E+03 failing,
# 1.57940095E+03 passing), so the probe is still not computing the same
# problem, and its stability cannot speak for the CI job.
#
# Remaining difference under test: the dependency set. The CI setup-linux
# action installs libhypre-dev, libmumps-dev, libparmetis-dev, libptscotch-dev,
# trilinos-all-dev, libnetcdff-dev and librocalution-dev. Earlier probes
# installed none of them. WITH_ROCALUTION is only forced off for non-gcc
# compilers, so a gcc build can pick ROCALUTION up when the package is there.
#
# Method: build the same source twice on one runner, once without those
# packages and once with them, and run mgdyn_harmonic_wire ten times against
# each. Everything else is held equal.
#
# Reading it: if the two builds give different norms, the dependency set is
# the differentiator and the next step is to bisect which package. If both
# give 1.57936883E+03, the difference is somewhere else and this line of
# enquiry is closed too.

on:
  push:
    branches: [ci/openblas-determinism-probe]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gfortran g++ gcc ninja-build \
                                  libblas-dev liblapack-dev libopenblas-dev \
                                  libsuitesparse-dev

      - name: build A - without the extra CI packages
        run: |
          cmake -S . -B buildA -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBLA_VENDOR=OpenBLAS \
            -DWITH_CHOLMOD=ON \
            -DWITH_MPI=OFF \
            -DWITH_OpenMP=ON \
            -DWITH_LUA=ON \
            -DWITH_ELMERGUI=OFF \
            -DWITH_ElmerIce=OFF 2>&1 | tee /tmp/configA.log
          cmake --build buildA -j$(getconf _NPROCESSORS_ONLN)

      - name: add the extra CI packages
        run: |
          # The set the CI setup-linux action installs for a gcc external-deps
          # entry, less the MPI and Qt packages this build does not use.
          sudo apt-get install -y libhypre-dev libparmetis-dev libptscotch-dev \
                                  libnetcdff-dev librocalution-dev || true
          echo "--- installed? ---"
          for p in libhypre-dev libparmetis-dev libptscotch-dev libnetcdff-dev librocalution-dev; do
            printf '%-22s %s\n' "$p" "$(dpkg -s "$p" >/dev/null 2>&1 && echo present || echo ABSENT)"
          done

      - name: build B - with the extra CI packages
        run: |
          cmake -S . -B buildB -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBLA_VENDOR=OpenBLAS \
            -DWITH_CHOLMOD=ON \
            -DWITH_MPI=OFF \
            -DWITH_OpenMP=ON \
            -DWITH_LUA=ON \
            -DWITH_ELMERGUI=OFF \
            -DWITH_ElmerIce=OFF 2>&1 | tee /tmp/configB.log
          cmake --build buildB -j$(getconf _NPROCESSORS_ONLN)

      - name: what did the two configures differ on
        run: |
          echo "=== lines present in one configure log but not the other ==="
          diff <(grep -E 'ROCALUTION|Hypre|HYPRE|Trilinos|Pardiso|Mumps|MUMPS|Cholmod|CHOLMOD|NetCDF|Scotch' /tmp/configA.log | sort -u) \
               <(grep -E 'ROCALUTION|Hypre|HYPRE|Trilinos|Pardiso|Mumps|MUMPS|Cholmod|CHOLMOD|NetCDF|Scotch' /tmp/configB.log | sort -u) \
               || true

      - name: run the test in both builds
        env:
          OMP_NUM_THREADS: 1
        run: |
          set +e
          REL=fem/tests/mgdyn_harmonic_wire/test-stdout.log

          run_in () {
            local dir=$1
            rm -f "${dir}/${REL}"
            ( cd "$dir" && ctest -R '^mgdyn_harmonic_wire$' > /tmp/run.log 2>&1 )
            local rc=$?
            local line
            line=$(grep -E 'CompareToReferenceSolution: Solver 4' "${dir}/${REL}" 2>/dev/null \
                   | head -1 | sed -E 's/^[[:space:]]*//')
            if [ -z "$line" ]; then
              echo "NO NORM (rc=$rc)"
              tail -4 /tmp/run.log | sed 's/^/      /'
            else
              echo "$line (rc=$rc)"
            fi
          }

          echo "=== build A: without the extra packages (expect 1.57936883E+03) ==="
          for i in $(seq 1 10); do echo "  A$i: $(run_in buildA)"; done

          echo ""
          echo "=== build B: with the extra packages ==="
          for i in $(seq 1 10); do echo "  B$i: $(run_in buildB)"; done
