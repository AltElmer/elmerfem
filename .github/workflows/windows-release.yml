# ============================================================================
# Windows Release Pipeline for ElmerFEM
# ============================================================================
# Builds native Windows binaries using MSYS2/UCRT64 and publishes both an
# NSIS installer (.exe) and a portable ZIP to GitHub Releases.
#
# Two pipelines:
#   - Nightly:  schedule (daily) or manual dispatch → overwrites "nightly" tag
#   - Tagged:   push of release-* tag → creates a new formal release
# ============================================================================

name: windows-release

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 03:00 UTC
  workflow_dispatch:       # Manual trigger (uses devel branch)
  push:
    tags:
      - 'release-*'       # Formal tagged releases

# Prevent duplicate nightly runs; tagged releases always run
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

# Permissions needed to create/update releases
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    name: Build Windows Packages (UCRT64)

    defaults:
      run:
        shell: msys2 {0}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # For nightly/dispatch builds, always build from devel
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'devel' || '' }}

      # ── 2. Setup MSYS2 ────────────────────────────────────────────────
      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
          pacboy: >-
            cc:p
            fc:p
            cmake:p
            msmpi:p
            openblas:p
            parmetis:p
            mumps:p
            suitesparse:p
            qt6-declarative:p
            qwt-qt6:p
            vtk:p
            adios2:p
            anari-sdk:p
            boost:p
            cgns:p
            cli11:p
            eigen3:p
            fast_float:p
            ffmpeg:p
            gl2ps:p
            liblas:p
            libmariadbclient:p
            netcdf:p
            openslide:p
            openvdb:p
            pdal:p
            scnlib:p
            unixodbc:p
            utf8cpp:p
            opencascade:p
            nsis:p
            parpack:p
            ntldd:p

      # ── 3. Install Microsoft MPI ──────────────────────────────────────
      - name: Install Microsoft MPI
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: msmpi

      # ── 4. Configure CMake ────────────────────────────────────────────
      - name: Configure
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/build
          cd ${GITHUB_WORKSPACE}/build
          cmake \
            -DCMAKE_BUILD_TYPE="Release" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/install" \
            -DCPACK_BUNDLE_EXTRA_WINDOWS_DLLS=OFF \
            -DBLA_VENDOR="OpenBLAS" \
            -DWITH_OpenMP=ON \
            -DWITH_LUA=ON \
            -DWITH_MPI=ON \
            -DMPI_TEST_MAXPROC=$(nproc) \
            -DMPIEXEC_EXECUTABLE="$(cygpath -m "${MSMPI_BIN}")/mpiexec.exe" \
            -DWITH_Zoltan=ON \
            -DCMAKE_C_FLAGS="-Wno-error=incompatible-pointer-types" \
            -DParMetis_LIBRARIES="$(pkg-config --libs parmetis)" \
            -DParMetis_INCLUDE_DIR="$(pkg-config --cflags parmetis)" \
            -DWITH_Mumps=ON \
            -DMumps_LIBRARIES="$(pkg-config -libs mumps-dmo);$(pkg-config -libs mumps-zmo);$(pkg-config -libs mumps-smo);$(pkg-config -libs mumps-cmo)" \
            -DMumps_INCLUDE_DIR="$(pkg-config --variable=includedir mumps-dmo);$(pkg-config --variable=includedir mumps-zmo);$(pkg-config --variable=includedir mumps-smo);$(pkg-config --variable=includedir mumps-cmo)" \
            -DWITH_ElmerIce=ON \
            -DWITH_ELMERGUI=ON \
            -DWITH_QT6=ON \
            -DWITH_VTK=ON \
            -DWITH_OCC=ON \
            -DWITH_MATC=ON \
            -DWITH_PARAVIEW=ON \
            -DCREATE_PKGCONFIG_FILE=OFF \
            -DMAKE_NSIS_PACKAGE=ON \
            -DMAKE_ZIP_PACKAGE=ON \
            -DEXTERNAL_UMFPACK=ON \
            -DEXTERNAL_ARPACK=ON \
            -DEXTERNAL_PARPACK=ON \
            ..

      # ── 5. Build ──────────────────────────────────────────────────────
      - name: Build
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --build . -j$(nproc)

      # ── 6. Install ────────────────────────────────────────────────────
      - name: Install
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --install .

      # ── 7. Bundle runtime DLLs (FIXED & ROBUST) ───────────────────────────
      - name: Bundle runtime dependencies
        run: |
          INSTALL_DIR="${GITHUB_WORKSPACE}/install"
          INSTALL_BIN="${INSTALL_DIR}/bin"
          MINGW_BIN="/${MSYSTEM,,}/bin"

          echo "::group::1. Force-Copy Critical Runtimes"
          # Explicitly copy GCC/MinGW runtimes (Fixes libgcc/libstdc++ errors)
          echo "Copying GCC/MinGW runtimes..."
          cp -u "${MINGW_BIN}/libgcc_s_seh-1.dll" "${INSTALL_BIN}/" || true
          cp -u "${MINGW_BIN}/libstdc++-6.dll" "${INSTALL_BIN}/" || true
          cp -u "${MINGW_BIN}/libwinpthread-1.dll" "${INSTALL_BIN}/" || true
          cp -u "${MINGW_BIN}/libgomp-1.dll" "${INSTALL_BIN}/" || true
          cp -u "${MINGW_BIN}/libquadmath-0.dll" "${INSTALL_BIN}/" || true
          cp -u "${MINGW_BIN}/libgfortran-5.dll" "${INSTALL_BIN}/" || true

          # Explicitly copy Core Qt Libraries (Fixes Qt6Core/Gui errors)
          echo "Copying Qt6 Core libraries..."
          for qtdll in Core Gui Widgets Network OpenGL Xml PrintSupport Svg; do
             cp -u "${MINGW_BIN}/Qt6${qtdll}.dll" "${INSTALL_BIN}/" || true
          done
          echo "::endgroup::"

          echo "::group::2. Dependency Walk (ldd)"
          # Helper function with CRASH PROTECTION (|| true)
          bundle_deps() {
            local pe="$1"
            # grep returns 1 if no matches found, so we add '|| true' to prevent script exit
            ldd "$pe" 2>/dev/null \
              | grep -i "/${MSYSTEM,,}/" \
              | awk '{print $3}' \
              | sort -u \
              | while IFS= read -r dll; do
                  if [ -f "$dll" ] && [ ! -f "${INSTALL_BIN}/$(basename "$dll")" ]; then
                    echo "Bundling: $(basename "$dll")"
                    cp "$dll" "${INSTALL_BIN}/"
                  fi
                done || true
          }

          # Pass 1: Scan Executables
          for exe in "${INSTALL_BIN}"/*.exe; do
            [ -f "$exe" ] && bundle_deps "$exe"
          done

          # Pass 2: Scan DLLs (Repeat loop to catch deep dependencies)
          for i in {1..2}; do
            echo "--- Walk Iteration $i ---"
            for dll in "${INSTALL_BIN}"/*.dll; do
               bundle_deps "$dll"
            done
          done
          echo "::endgroup::"

          echo "::group::3. Deploy Qt Plugins"
          # Plugins are in /share/qt6/plugins on UCRT64
          QT6_PLUGIN_DIR="/${MSYSTEM,,}/share/qt6/plugins"
          
          for plugin in platforms styles imageformats iconengines tls; do
            src="${QT6_PLUGIN_DIR}/${plugin}"
            dst="${INSTALL_BIN}/${plugin}"
            if [ -d "$src" ]; then
              mkdir -p "$dst"
              cp -u "$src"/*.dll "$dst/" 2>/dev/null || true
            fi
          done

          # Create qt.conf to force Qt to look in local directory
          echo "[Paths]" > "${INSTALL_BIN}/qt.conf"
          echo "Plugins = ." >> "${INSTALL_BIN}/qt.conf"
          echo "::endgroup::"

          echo "::group::4. Bundle MS-MPI"
          if [ -n "${MSMPI_BIN:-}" ]; then
            MSMPI_UNIX="$(cygpath -u "${MSMPI_BIN}")"
            cp -un "${MSMPI_UNIX}/mpiexec.exe" "${INSTALL_BIN}/" 2>/dev/null || true
            cp -un "${MSMPI_UNIX}/msmpi.dll" "${INSTALL_BIN}/" 2>/dev/null || true
          fi
          echo "::endgroup::"
          
      # ── 8. Package with CPack ─────────────────────────────────────────
      - name: Package (NSIS + ZIP)
        run: |
          cd ${GITHUB_WORKSPACE}/build
          # Generate both NSIS installer and ZIP archive
          cpack -G "NSIS;ZIP" -V

      # ── 9. Upload build artifacts ─────────────────────────────────────
      # Always upload regardless of release step outcome, useful for debugging.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elmerfem-windows-packages
          path: |
            build/*.exe
            build/*.zip
          retention-days: 14

      # ── 10. Determine release metadata ────────────────────────────────
      - name: Set release variables
        id: release-vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "name=ElmerFEM ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "body=Official release **${{ github.ref_name }}**." >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "name=Nightly Build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
            SHA=$(git rev-parse --short HEAD)
            echo "body=Automated nightly build from \`devel\` branch.%0A%0A- **Date:** ${DATE}%0A- **Commit:** ${SHA}" >> "$GITHUB_OUTPUT"
          fi

      # ── 11. Publish to GitHub Releases ────────────────────────────────
      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-vars.outputs.tag }}
          name: ${{ steps.release-vars.outputs.name }}
          body: ${{ steps.release-vars.outputs.body }}
          prerelease: ${{ steps.release-vars.outputs.prerelease }}
          make_latest: ${{ steps.release-vars.outputs.make_latest }}
          files: |
            build/*.exe
            build/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
