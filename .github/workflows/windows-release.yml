# ============================================================================
# Windows Release Pipeline for ElmerFEM
# ============================================================================
# Builds native Windows binaries using MSYS2/UCRT64 and publishes both an
# NSIS installer (.exe) and a portable ZIP to GitHub Releases.
#
# Two pipelines:
#   - Nightly:  schedule (daily) or manual dispatch → overwrites "nightly" tag
#   - Tagged:   push of release-* tag → creates a new formal release
# ============================================================================

name: windows-release

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 03:00 UTC
  workflow_dispatch:       # Manual trigger (uses devel branch)
  push:
    tags:
      - 'release-*'       # Formal tagged releases

# Prevent duplicate nightly runs; tagged releases always run
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

# Permissions needed to create/update releases
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    name: Build Windows Packages (UCRT64)

    defaults:
      run:
        shell: msys2 {0}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # For nightly/dispatch builds, always build from devel
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'devel' || '' }}

      # ── 2. Setup MSYS2 ────────────────────────────────────────────────
      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
          pacboy: >-
            cc:p
            fc:p
            cmake:p
            msmpi:p
            openblas:p
            parmetis:p
            mumps:p
            suitesparse:p
            qt6-declarative:p
            qwt-qt6:p
            vtk:p
            adios2:p
            anari-sdk:p
            boost:p
            cgns:p
            cli11:p
            eigen3:p
            fast_float:p
            ffmpeg:p
            gl2ps:p
            liblas:p
            libmariadbclient:p
            netcdf:p
            openslide:p
            openvdb:p
            pdal:p
            scnlib:p
            unixodbc:p
            utf8cpp:p
            opencascade:p
            nsis:p
            parpack:p
            ntldd:p

      # ── 3. Install Microsoft MPI ──────────────────────────────────────
      - name: Install Microsoft MPI
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: msmpi

      # ── 4. Configure CMake ────────────────────────────────────────────
      - name: Configure
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/build
          cd ${GITHUB_WORKSPACE}/build
          cmake \
            -DCMAKE_BUILD_TYPE="Release" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/install" \
            -DCPACK_BUNDLE_EXTRA_WINDOWS_DLLS=OFF \
            -DBLA_VENDOR="OpenBLAS" \
            -DWITH_OpenMP=ON \
            -DWITH_LUA=ON \
            -DWITH_MPI=ON \
            -DMPI_TEST_MAXPROC=$(nproc) \
            -DMPIEXEC_EXECUTABLE="$(cygpath -m "${MSMPI_BIN}")/mpiexec.exe" \
            -DWITH_Zoltan=ON \
            -DCMAKE_C_FLAGS="-Wno-error=incompatible-pointer-types" \
            -DParMetis_LIBRARIES="$(pkg-config --libs parmetis)" \
            -DParMetis_INCLUDE_DIR="$(pkg-config --cflags parmetis)" \
            -DWITH_Mumps=ON \
            -DMumps_LIBRARIES="$(pkg-config -libs mumps-dmo);$(pkg-config -libs mumps-zmo);$(pkg-config -libs mumps-smo);$(pkg-config -libs mumps-cmo)" \
            -DMumps_INCLUDE_DIR="$(pkg-config --variable=includedir mumps-dmo);$(pkg-config --variable=includedir mumps-zmo);$(pkg-config --variable=includedir mumps-smo);$(pkg-config --variable=includedir mumps-cmo)" \
            -DWITH_ElmerIce=ON \
            -DWITH_ELMERGUI=ON \
            -DWITH_QT6=ON \
            -DWITH_VTK=ON \
            -DWITH_OCC=ON \
            -DWITH_MATC=ON \
            -DWITH_PARAVIEW=ON \
            -DCREATE_PKGCONFIG_FILE=OFF \
            -DMAKE_NSIS_PACKAGE=ON \
            -DMAKE_ZIP_PACKAGE=ON \
            -DEXTERNAL_UMFPACK=ON \
            -DEXTERNAL_ARPACK=ON \
            -DEXTERNAL_PARPACK=ON \
            ..

      # ── 5. Build ──────────────────────────────────────────────────────
      - name: Build
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --build . -j$(nproc)

      # ── 6. Install ────────────────────────────────────────────────────
      - name: Install
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --install .

      # ── 7. Bundle runtime DLLs ────────────────────────────────────────
      # Elmer's own CPACK_BUNDLE_EXTRA_WINDOWS_DLLS mechanism expects
      # pre-populated bundle directories and misses transitive deps.
      # Instead, we use ntldd to recursively discover all MSYS2 DLLs
      # needed by every .exe and .dll we ship, plus deploy Qt6 plugins.
      - name: Bundle runtime dependencies
        run: |
          set -euo pipefail
          INSTALL_DIR="${GITHUB_WORKSPACE}/install"
          INSTALL_BIN="${INSTALL_DIR}/bin"
          MINGW_BIN="/${MSYSTEM,,}/bin"
          MINGW_LIB="/${MSYSTEM,,}/lib"

          echo "::group::Collect DLL dependencies from bin/"
          # Pass 1: executables and DLLs in bin/
          for pe in "${INSTALL_BIN}"/*.exe "${INSTALL_BIN}"/*.dll; do
            [ -f "$pe" ] || continue
            ntldd -R "$pe" 2>/dev/null \
              | grep -io "[a-z]:.*/${MSYSTEM,,}/.*\.dll" \
              | while IFS= read -r dll; do
                  dll_unix="$(cygpath -u "$dll")"
                  [ -f "$dll_unix" ] && cp -un "$dll_unix" "${INSTALL_BIN}/" 2>/dev/null || true
                done
          done
          echo "::endgroup::"

          echo "::group::Collect DLL dependencies from solver modules"
          # Pass 2: solver plugin DLLs
          SOLVER_LIB="${INSTALL_DIR}/share/elmersolver/lib"
          if [ -d "$SOLVER_LIB" ]; then
            for dll in "${SOLVER_LIB}"/*.dll; do
              [ -f "$dll" ] || continue
              ntldd -R "$dll" 2>/dev/null \
                | grep -io "[a-z]:.*/${MSYSTEM,,}/.*\.dll" \
                | while IFS= read -r dep; do
                    dep_unix="$(cygpath -u "$dep")"
                    [ -f "$dep_unix" ] && cp -un "$dep_unix" "${INSTALL_BIN}/" 2>/dev/null || true
                  done
            done
          fi
          echo "::endgroup::"

          echo "::group::Resolve newly-added DLLs (transitive pass)"
          # Pass 3: the DLLs we just copied may themselves have deps
          for dll in "${INSTALL_BIN}"/*.dll; do
            [ -f "$dll" ] || continue
            ntldd -R "$dll" 2>/dev/null \
              | grep -io "[a-z]:.*/${MSYSTEM,,}/.*\.dll" \
              | while IFS= read -r dep; do
                  dep_unix="$(cygpath -u "$dep")"
                  [ -f "$dep_unix" ] && cp -un "$dep_unix" "${INSTALL_BIN}/" 2>/dev/null || true
                done
          done
          echo "::endgroup::"

          echo "::group::Deploy Qt6 plugins"
          # Qt6 needs platform plugins to run; without qwindows.dll,
          # ElmerGUI crashes with "no Qt platform plugin could be initialized"
          QT6_PLUGIN_DIR="${MINGW_LIB}/qt6/plugins"
          for plugin_type in platforms styles imageformats iconengines generic tls networkinformation; do
            src="${QT6_PLUGIN_DIR}/${plugin_type}"
            dst="${INSTALL_BIN}/${plugin_type}"
            if [ -d "$src" ]; then
              mkdir -p "$dst"
              cp -u "$src"/*.dll "$dst/" 2>/dev/null || true
              # Also resolve deps of the plugins themselves
              for pdll in "$dst"/*.dll; do
                [ -f "$pdll" ] || continue
                ntldd -R "$pdll" 2>/dev/null \
                  | grep -io "[a-z]:.*/${MSYSTEM,,}/.*\.dll" \
                  | while IFS= read -r dep; do
                      dep_unix="$(cygpath -u "$dep")"
                      [ -f "$dep_unix" ] && cp -un "$dep_unix" "${INSTALL_BIN}/" 2>/dev/null || true
                    done
              done
            fi
          done

          # qt.conf tells Qt6 to look for plugins relative to the binary dir
          cat > "${INSTALL_BIN}/qt.conf" << 'QTCONF'
          [Paths]
          Plugins = .
          QTCONF
          # Strip leading whitespace from heredoc
          sed -i 's/^[[:space:]]*//' "${INSTALL_BIN}/qt.conf"
          echo "::endgroup::"

          echo "::group::Bundle MS-MPI runtime"
          if [ -n "${MSMPI_BIN:-}" ]; then
            MSMPI_UNIX="$(cygpath -u "${MSMPI_BIN}")"
            for mpi_bin in mpiexec.exe smpd.exe; do
              [ -f "${MSMPI_UNIX}/${mpi_bin}" ] && cp -un "${MSMPI_UNIX}/${mpi_bin}" "${INSTALL_BIN}/" 2>/dev/null || true
            done
            # msmpi.dll is typically in the system or MSMPI lib dir
            MSMPI_DLL_DIR="$(cygpath -u "${MSMPI_BIN}/../Lib/x64")"
            [ -f "${MSMPI_DLL_DIR}/msmpi.dll" ] && cp -un "${MSMPI_DLL_DIR}/msmpi.dll" "${INSTALL_BIN}/" 2>/dev/null || true
            # Also try the bin directory itself
            [ -f "${MSMPI_UNIX}/msmpi.dll" ] && cp -un "${MSMPI_UNIX}/msmpi.dll" "${INSTALL_BIN}/" 2>/dev/null || true
          fi
          echo "::endgroup::"

          echo "=== Total bundled DLLs in bin/: $(find "${INSTALL_BIN}" -name '*.dll' | wc -l) ==="
          echo "=== Qt6 plugin dirs: $(ls -d "${INSTALL_BIN}"/platforms "${INSTALL_BIN}"/styles "${INSTALL_BIN}"/imageformats 2>/dev/null | tr '\n' ' ') ==="

      # ── 8. Package with CPack ─────────────────────────────────────────
      - name: Package (NSIS + ZIP)
        run: |
          cd ${GITHUB_WORKSPACE}/build
          # Generate both NSIS installer and ZIP archive
          cpack -G "NSIS;ZIP" -V

      # ── 9. Upload build artifacts ─────────────────────────────────────
      # Always upload regardless of release step outcome, useful for debugging.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elmerfem-windows-packages
          path: |
            build/*.exe
            build/*.zip
          retention-days: 14

      # ── 10. Determine release metadata ────────────────────────────────
      - name: Set release variables
        id: release-vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "name=ElmerFEM ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "body=Official release **${{ github.ref_name }}**." >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "name=Nightly Build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
            SHA=$(git rev-parse --short HEAD)
            echo "body=Automated nightly build from \`devel\` branch.%0A%0A- **Date:** ${DATE}%0A- **Commit:** ${SHA}" >> "$GITHUB_OUTPUT"
          fi

      # ── 11. Publish to GitHub Releases ────────────────────────────────
      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-vars.outputs.tag }}
          name: ${{ steps.release-vars.outputs.name }}
          body: ${{ steps.release-vars.outputs.body }}
          prerelease: ${{ steps.release-vars.outputs.prerelease }}
          make_latest: ${{ steps.release-vars.outputs.make_latest }}
          files: |
            build/*.exe
            build/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
