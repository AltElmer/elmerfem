          CTEST_OUTPUT_ON_FAILURE: 1
        run: |-
          cd ${GITHUB_WORKSPACE}/build
          bash ${GITHUB_WORKSPACE}/.github/scripts/rerun-failed-tests.sh
    if: (github.event_name == 'schedule' && github.event.schedule == '50 09 * * 4') || (github.event_name == 'workflow_dispatch' && (inputs.profile == 'all' || inputs.profile == 'full-clang'))
  elmerice:
