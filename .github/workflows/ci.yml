name: ci
on:
  push:
    paths-ignore:
      - '**.nix'
      - 'flake.lock'
  pull_request:
    paths-ignore:
      - '**.nix'
      - 'flake.lock'
  schedule:
    # Preserve the staggered full-suite coverage from the split workflows.
    - cron: '50 09 * * 2' # GCC: Tuesday 09:50 UTC
    - cron: '50 09 * * 4' # Clang: Thursday 09:50 UTC
  workflow_dispatch:
    inputs:
      profile:
        description: CI profile to run
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
          - act
          - full-gcc
          - full-clang
          - elmerice
          - parallel
concurrency:
  # A branch push and its pull_request/synchronize event share a group. This
  # prevents the duplicate matrices observed on the prototype PR. Scheduled
  # and manually selected profiles remain independent.
  group: ci-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && (github.head_ref || github.ref_name) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: true
jobs:
  linux:
    # For available GitHub-hosted runners, see:

    # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (${{ matrix.compiler }} ${{ matrix.mpi }} MPI ${{ matrix.openmp }} OpenMP)
    strategy:
      # Allow other runners in the matrix to continue if some fail
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc]
        fc: [gfortran]
        mpi: [with]
        openmp: [with]
        include:
          - os: ubuntu-24.04
            compiler: gcc
            compiler-pkgs: "g++ gcc"
            cc: "gcc"
            cxx: "g++"
            mpi: with
            openmp: with
            openmp-cmake-flags: "-DWITH_OpenMP=ON"
          - os: ubuntu-24.04
            compiler: gcc
            compiler-pkgs: "g++ gcc"
            cc: "gcc"
            cxx: "g++"
            mpi: without
            openmp: with
            openmp-cmake-flags: "-DWITH_OpenMP=ON"
          - os: ubuntu-24.04
            compiler: gcc
            compiler-pkgs: "g++ gcc"
            cc: "gcc"
            cxx: "g++"
            mpi: with
            openmp: without
            openmp-cmake-flags: "-DWITH_OpenMP=OFF"
          - os: ubuntu-24.04-arm
            compiler: gcc
            compiler-pkgs: "g++ gcc"
            cc: "gcc"
            cxx: "g++"
            mpi: with
            openmp: without
            openmp-cmake-flags: "-DWITH_OpenMP=OFF"
          - os: ubuntu-24.04
            compiler: clang
            compiler-pkgs: "clang"
            cc: "clang"
            cxx: "clang++"
            mpi: with
            openmp: without
            openmp-cmake-flags: "-DWITH_OpenMP=OFF"
          - os: ubuntu-24.04
            compiler: flang
            compiler-pkgs: "clang-20 flang-20"
            cc: "clang-20"
            cxx: "clang++-20"
            fc: "flang-20"
            mpi: without
            openmp: without
            openmp-cmake-flags: "-DWITH_OpenMP=OFF"
            # - compiler: clang
    #   compiler-pkgs: "clang libomp-dev"

    #   cc: "clang"

    #   cxx: "clang++"

    #   mpi: with

    #   openmp: with

    #   openmp-cmake-flags: "-DWITH_OpenMP=ON -DOpenMP_C_FLAGS='-fopenmp=libgomp -D_OPENMP=201511' -DOpenMP_CXX_FLAGS='-fopenmp=libgomp -D_OPENMP=201511' -DOpenMP_C_LIB_NAMES='gomp;pthread' -DOpenMP_CXX_LIB_NAMES='gomp;pthread'"
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      FC: ${{ matrix.fc }}
    steps:
      - name: get CPU information
        run: lscpu
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: install dependencies
        # OpenBLAS before version 0.3.29 shipped kernels for ?NRM2 on

        # Neoverse N2 that was inaccurate or returned NaN.  Use the

        # reference implementation for the Ubuntu on ARM runners to avoid

        # that issue.

        # Consider reverting to OpenBLAS for all runners once Ubuntu ships

        # a new enough version.
        run: |
          sudo apt -qq update
          sudo apt install -y ${{ matrix.compiler-pkgs }} cmake gfortran \
            $([ "${{ matrix.os }}" == "ubuntu-24.04-arm" ] && echo "libblas-dev liblapack-dev" || echo "libopenblas-dev") \
            $([ "${{ matrix.mpi }}" == "with" ] && echo "libhypre-dev") \
            $([ "${{ matrix.mpi }}" == "with" ] && echo "libopenmpi-dev libmumps-dev libparmetis-dev") \
            $([ "${{ matrix.compiler }}" == "gcc" ] && [ "${{ matrix.mpi }}" == "without" ] && echo "libmumps-seq-dev") \
            $([ "${{ matrix.compiler }}" == "gcc" ] && echo "libsuitesparse-dev") \
            $([ "${{ matrix.compiler }}" == "gcc" ] && [ "${{ matrix.mpi }}" == "with" ] && echo "librocalution-dev") \
            libqwt-qt5-dev qtscript5-dev libqt5svg5-dev \
            libvtk9-qt-dev libglvnd-dev \
            occt-misc libocct-data-exchange-dev libocct-draw-dev \
            $([ "${{ matrix.mpi }}" == "with" ] && echo "trilinos-all-dev libptscotch-dev") \
            $([ "${{ matrix.mpi }}" == "with" ] && echo "libnetcdff-dev")
      - name: configure
        # CHOLMOD and rocALUTION require a working OpenMP package. So, disable them for clang.

        run: |
          # work around error in the rocALUTION CMake config file distributed by Ubuntu
          if [ "${{ matrix.compiler }}" == "gcc" ] && [ "${{ matrix.mpi }}" == "with" ]; then
            sudo sed -i '/find_dependency(HIP)/d' /usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/cmake/rocalution/rocalution-config.cmake
          fi
          mkdir ${GITHUB_WORKSPACE}/build
          cd ${GITHUB_WORKSPACE}/build
          cmake \
            -DCMAKE_BUILD_TYPE="Release" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/usr" \
            $([ "${{ matrix.compiler }}" == "flang" ] && echo "-DHAVE_QP=OFF" || echo "-DHAVE_QP=ON") \
            $([ "${{ matrix.os }}" == "ubuntu-24.04-arm" ] && echo "-DBLA_VENDOR=Generic" || echo "-DBLA_VENDOR=OpenBLAS") \
            ${{ matrix.openmp-cmake-flags }} \
            -DWITH_LUA=ON \
            $([ "${{ matrix.mpi }}" == "with" ] && echo "-DWITH_Zoltan=ON" || echo "-DWITH_Zoltan=OFF") \
            $([ "${{ matrix.compiler }}" == "gcc" ] && echo "-DWITH_Mumps=ON" || echo "-DWITH_Mumps=OFF") \
            $([ "${{ matrix.compiler }}" == "gcc" ] && echo "-DWITH_CHOLMOD=ON" || echo "-DWITH_CHOLMOD=OFF") \
            $([ "${{ matrix.mpi }}" == "with" ] && echo "-DWITH_Hypre=ON -DHYPRE_INCLUDE_DIR=/usr/include/hypre" || echo "-DWITH_Hypre=OFF") \
            $([ "${{ matrix.compiler }}" == "gcc" ] && [ "${{ matrix.mpi }}" == "with" ] && echo "-DWITH_ROCALUTION=ON" || echo "-DWITH_ROCALUTION=OFF") \
            $([ "${{ matrix.mpi }}" == "with" ] && echo "-DWITH_ElmerIce=ON" || echo "-DWITH_ElmerIce=OFF") \
            -DWITH_ELMERGUI=ON \
            -DWITH_VTK=ON \
            -DWITH_OCC=ON \
            -DWITH_MATC=ON \
            -DWITH_PARAVIEW=ON \
            -DCREATE_PKGCONFIG_FILE=ON \
            $([ "${{ matrix.mpi }}" == "with" ] && echo "-DWITH_MPI=ON -DMPI_TEST_MAXPROC=2 -DMPIEXEC_PREFLAGS=--allow-run-as-root" || echo "-DWITH_MPI=OFF") \
            $([ "${{ matrix.mpi }}" == "with" ] && echo "-DWITH_Trilinos=ON" || echo "-DWITH_Trilinos=OFF") \
            ..
      - name: build
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --build . -j$(nproc)
      - name: install
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --install .
      - name: check
        id: run-ctest
        timeout-minutes: 150
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |
          cd ${GITHUB_WORKSPACE}/build
          # -j2 instead of -j$(nproc) on the MPI+OpenMP job. The hosted runners
          # have 4 vCPUs on 2 physical cores and the test macro derives
          # OMP_NUM_THREADS from the physical core count, so -j$(nproc) ran
          # 4 tests x 2 OpenMP threads on 4 vCPUs. Trying whether backing that
          # 2x oversubscription off changes the intermittent SIGSEGVs seen
          # inside PMIx during MPI init. The other entries keep -j$(nproc):
          # all but one build without OpenMP, and the one that does (gcc,
          # no MPI) has no MPI stack for oversubscription to destabilise.
          ctest . \
            -LE slow \
            -j$([ "${{ matrix.mpi }}" == "with" ] && [ "${{ matrix.openmp }}" == "with" ] && echo 2 || nproc) \
            --timeout 600
      - name: Re-run tests
        if: always() && (steps.run-ctest.outcome == 'failure')
        timeout-minutes: 60
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |-
          cd ${GITHUB_WORKSPACE}/build
          bash ${GITHUB_WORKSPACE}/.github/scripts/rerun-failed-tests.sh
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.profile == 'all' || inputs.profile == 'linux')
  macos-homebrew:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (using ${{ matrix.blas }})
    strategy:
      # Allow other runners in the matrix to continue if some fail
      fail-fast: false
      matrix:
        os: [macos-14]
        blas: [openblas, accelerate]
        include:
          - os: macos-15-intel
            blas: openblas
    steps:
      - name: get CPU information
        run: |
          sysctl hw
          sysctl machdep
      - name: checkout repository
        uses: actions/checkout@v7
      - name: install dependencies
        # Homebrew's Python conflicts with the Python that comes pre-installed

        # on the GitHub runners. Some of the dependencies depend on different

        # versions of Homebrew's Python. Enforce using the ones from Homebrew

        # to avoid errors on updates.

        # See: https://github.com/orgs/Homebrew/discussions/3928

        # It looks like "gfortran" isn't working correctly unless "gcc" is

        # re-installed.
        run: |
          brew update
          brew install --overwrite python@3.12 python@3.13
          brew reinstall gcc
          brew install \
            cmake \
            ${{ matrix.blas == 'openblas' && 'openblas' || '' }} \
            ${{ matrix.blas == 'accelerate' && 'veclibfort' || '' }} \
            open-mpi \
            libomp suitesparse \
            qwt vtk opencascade expat
          echo "HOMEBREW_PREFIX=$(brew --prefix)" >> $GITHUB_ENV
      - name: configure
        env:
          LDFLAGS: ${{ format('-L{0}/opt/libomp/lib -lomp', env.HOMEBREW_PREFIX) }}
        # SD_H1BasisEvaluation and SD_LinearFormsAssembly used to fail on

        # macos-15-intel (Intel CPU) at `-O3` (passed at `-O2`): the same

        # GaussPointsAdapt SAVE-state race noted above (LinearFormsAssembly

        # calls GaussPoints(...,PReferenceElement=.TRUE.) from every OMP

        # thread), with -O3 inlining/scheduling changing the odds of hitting

        # the race window. Fixed; back to Release/-O3.
        run: |
          if [ "x${{ matrix.blas }}" == "xaccelerate" ]; then
            export VECLIBFORT_PREFIX=$(brew --prefix veclibfort)
          fi
          mkdir ${GITHUB_WORKSPACE}/build
          cd ${GITHUB_WORKSPACE}/build
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_Fortran_COMPILER=gfortran \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/usr" \
            ${{ matrix.blas == 'openblas' && '-DBLA_VENDOR="OpenBLAS"' || '' }} \
            ${{ matrix.blas == 'accelerate'
              && '-DBLAS_LIBRARIES="${VECLIBFORT_PREFIX}/lib/libvecLibFort.dylib" \
                  -DLAPACK_LIBRARIES="${VECLIBFORT_PREFIX}/lib/libvecLibFort.dylib"' || '' }} \
            -DUSE_MACOS_PACKAGE_MANAGER=OFF \
            -DCMAKE_PREFIX_PATH="${HOMEBREW_PREFIX}/opt/libomp;${HOMEBREW_PREFIX}/opt/openblas;${HOMEBREW_PREFIX}/opt/qt;${HOMEBREW_PREFIX}/opt/qwt" \
            -DWITH_OpenMP=ON \
            -DOpenMP_C_FLAGS="-Xclang -fopenmp -I${HOMEBREW_PREFIX}/opt/libomp/include" \
            -DOpenMP_CXX_FLAGS="-Xclang -fopenmp -I${HOMEBREW_PREFIX}/opt/libomp/include" \
            -DOpenMP_Fortran_FLAGS="-fopenmp -I${HOMEBREW_PREFIX}/opt/libomp/include" \
            -DWITH_LUA=ON \
            -DWITH_MPI=ON \
            -DMPI_TEST_MAXPROC=2 \
            -DWITH_Zoltan=OFF \
            -DWITH_Mumps=OFF \
            -DWITH_CHOLMOD=ON \
            -DWITH_ElmerIce=ON \
            -DWITH_ELMERGUI=ON \
            -DWITH_QT6=ON \
            -DQWT_INCLUDE_DIR="${HOMEBREW_PREFIX}/opt/qwt/lib/qwt.framework/Headers" \
            -DWITH_VTK=ON \
            -DEXPAT_INCLUDE_DIR="${HOMEBREW_PREFIX}/opt/expat/include" \
            -DWITH_OCC=ON \
            -DWITH_MATC=ON \
            -DWITH_PARAVIEW=ON \
            -DCREATE_PKGCONFIG_FILE=ON \
            ..
      - name: build
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --build . -j$(sysctl -n hw.logicalcpu)
      - name: install
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --install .
      - name: check
        id: run-ctest
        timeout-minutes: 150
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |
          cd ${GITHUB_WORKSPACE}/build
          ctest . \
            -LE slow \
            --timeout 600
        #           -j$(sysctl -n hw.logicalcpu) \
      - name: re-run tests
        if: always() && (steps.run-ctest.outcome == 'failure')
        timeout-minutes: 60
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |-
          cd ${GITHUB_WORKSPACE}/build
          bash ${GITHUB_WORKSPACE}/.github/scripts/rerun-failed-tests.sh
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.profile == 'all' || inputs.profile == 'macos')
  windows-mingw:
    runs-on: windows-latest
    name: MSYS2 (${{ matrix.msystem }} ${{ matrix.mpi }} MPI, ${{ matrix.dependencies }} dependencies)
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      # Allow other runners in the matrix to continue if some fail
      fail-fast: false
      matrix:
        msystem: [UCRT64]
        dependencies: [bundled, external]
        mpi: [with, without]
        include:
          - dependencies: external
            external-packages: parpack:p metis:p
            external-cmake-flags: -DEXTERNAL_UMFPACK=ON -DEXTERNAL_ARPACK=ON -DEXTERNAL_PARPACK=ON -DEXTERNAL_METIS=ON
    steps:
      - name: get CPU name
        shell: pwsh
        run: |
          Get-CIMInstance -Class Win32_Processor | Select-Object -Property Name
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: unshallow Zoltan submodule
        shell: bash
        run: git -C contrib/Zoltan_v3.83 fetch --unshallow 2>/dev/null || true
      - name: install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel git
          pacboy: >-
            cc:p fc:p cmake:p ${{ matrix.mpi == 'with' && 'msmpi:p' || 'openblas:p' }} openblas:p ${{ matrix.mpi == 'with' && 'parmetis:p' || 'openblas:p' }} mumps:p suitesparse:p qt6-declarative:p qwt-qt6:p vtk:p adios2:p anari-sdk:p  boost:p cgns:p cli11:p eigen3:p exprtk:p fast_float:p ffmpeg:p gl2ps:p liblas:p libmariadbclient:p netcdf:p  openslide:p openvdb:p pdal:p scnlib:p seacas:p unixodbc:p utf8cpp:p opencascade:p nlohmann-json:p ${{ matrix.external-packages }} ${{ matrix.dependencies == 'bundled' && 'nsis:p ntldd:p' || '' }}
      - name: install MSMPI
        if: matrix.mpi == 'with'
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: msmpi
      - name: configure
        # Downgrade incompatible-pointer-types to a warning to work around

        # build error of Zoltan with newer GCC.
        run: |
          mkdir ${GITHUB_WORKSPACE}/build
          cd ${GITHUB_WORKSPACE}/build
          declare -a _extra_config
          if [ "${{ matrix.mpi }}" == "with" ]; then
            _extra_config+=("-DWITH_MPI=ON"
                            "-DMPI_TEST_MAXPROC=$(nproc)"
                            "-DMPIEXEC_EXECUTABLE=$(cygpath -m "${MSMPI_BIN}")/mpiexec.exe"
                            "-DWITH_Zoltan=ON"
                            "-DWITH_ElmerIce=ON"
                            "-DParMetis_LIBRARIES=$(pkg-config --libs parmetis)"
                            "-DParMetis_INCLUDE_DIR=$(pkg-config --cflags parmetis)"
                            "-DWITH_Mumps=ON"
                            "-DMumps_LIBRARIES=$(pkg-config --libs mumps-dmo mumps-zmo mumps-smo mumps-cmo)"
                            "-DMumps_INCLUDE_DIR=$(pkg-config --variable=includedir mumps-dmo)")
          else
            _extra_config+=("-DWITH_MPI=OFF"
                            "-DWITH_Zoltan=OFF"
                            "-DWITH_ElmerIce=OFF"
                            "-DWITH_Mumps=ON"
                            "-DMumps_LIBRARIES=$(pkg-config --libs mumps-dto mumps-zto mumps-sto mumps-cto)"
                            "-DMumps_INCLUDE_DIR=$(pkg-config --variable=includedir mumps-dto)")
          fi
          if [ "${{ matrix.dependencies }}" == "bundled" ]; then
            SANITIZED_REF_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^A-Za-z0-9._-]/_/g')
            # add flags for creating a bundle with CPack
            _extra_config+=("-DCPACK_PACKAGE_BASE_FILE_NAME=elmerfem-${{ matrix.mpi == 'with' && 'mpi' || 'nompi' }}-${SANITIZED_REF_NAME}"
                            "-DCPACK_BUNDLE_EXTRA_WINDOWS_DLLS=ON"
                            "-DBUNDLE_MSYS2_PACKAGES=ON"
                            "-DBUNDLE_MSYS2_PACKAGES_PREFIX=$(cygpath -m "${GITHUB_WORKSPACE}")/msys2_prefix")
            if [ "${{ matrix.mpi }}" == "with" ]; then
              _extra_config+=("-DBUNDLE_MSMPI_REDIST=ON")
            fi
          else
            _extra_config+=("-DCPACK_BUNDLE_EXTRA_WINDOWS_DLLS=OFF")
          fi
          cmake \
            -DCMAKE_BUILD_TYPE="Release" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/usr" \
            "${_extra_config[@]}" \
            -DBLA_VENDOR="OpenBLAS" \
            -DWITH_OpenMP=ON \
            -DWITH_LUA=ON \
            -DCMAKE_C_FLAGS="-Wno-error=incompatible-pointer-types" \
            -DWITH_ELMERGUI=ON \
            -DWITH_QT6=ON \
            -DWITH_VTK=ON \
            -DWITH_OCC=ON \
            -DWITH_MATC=ON \
            -DWITH_PARAVIEW=ON \
            -DCREATE_PKGCONFIG_FILE=ON \
            ${{ matrix.external-cmake-flags }} \
            ..
      - name: exclude build output from Windows Defender scanning
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"
      - name: build
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --build .
      - name: create bundles
        if: matrix.dependencies == 'bundled'
        id: create-bundles
        run: |
          MSYS2_GITHUB_WORKSPACE="$(cygpath -u "${GITHUB_WORKSPACE}")"
          echo "::group::Download packages from MSYS2"
          mkdir -p "${MSYS2_GITHUB_WORKSPACE}"/msys2_packages
          pactree -u ${MINGW_PACKAGE_PREFIX}-fc | \
            pacman -Sw --noconfirm \
            --cachedir "${MSYS2_GITHUB_WORKSPACE}"/msys2_packages -
          echo "::endgroup::"
          echo "::group::Extract MSYS2 packages"
          mkdir -p "${MSYS2_GITHUB_WORKSPACE}"/msys2_prefix
          for pkg in "${MSYS2_GITHUB_WORKSPACE}"/msys2_packages/*.pkg.tar.zst; do
            echo "extracting $pkg..."
            bsdtar -xf "$pkg" -C "${MSYS2_GITHUB_WORKSPACE}"/msys2_prefix --strip-component=1
          done
          # remove files with metadata
          rm -rf "${MSYS2_GITHUB_WORKSPACE}"/msys2_prefix/.{PKGINFO,BUILDINFO,MTREE}
          echo "::endgroup::"
          if [ "${{ matrix.mpi }}" == "with" ]; then
            echo "::group::Copy MSMPI installer to a location where it can be found"
            mkdir ${GITHUB_WORKSPACE}/../msmpi_redist
            cp "$(cygpath -m "${MSMPI_BIN}")/../Redist/MSMpiSetup.exe" "${GITHUB_WORKSPACE}/../msmpi_redist/"
            echo "::endgroup::"
          fi
          echo "::group::Create bundles"
          cd ${GITHUB_WORKSPACE}/build
          cpack -G "ZIP;NSIS64" .
          echo "::endgroup::"
          # store name of bundle for following steps
          cmake -LA -N .. | awk -F= '$1~/CPACK_PACKAGE_FILE_NAME:STRING/{print "bundle-name="$2}' >> $GITHUB_OUTPUT
      - name: upload installer
        if: matrix.dependencies == 'bundled'
        uses: actions/upload-artifact@v7
        with:
          name: elmerfem-${{ matrix.mpi == 'with' && 'mpi' || 'nompi' }}-installer
          path: ${{ github.workspace }}/build/${{ steps.create-bundles.outputs.bundle-name }}.exe
          archive: false
      - name: upload zip archive
        if: matrix.dependencies == 'bundled'
        uses: actions/upload-artifact@v7
        with:
          name: elmerfem-${{ matrix.mpi == 'with' && 'mpi' || 'nompi' }}-zip
          path: ${{ github.workspace }}/build/${{ steps.create-bundles.outputs.bundle-name }}.zip
          archive: false
      - name: install
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --install .
      - name: check
        id: run-ctest
        timeout-minutes: 150
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |
          cd ${GITHUB_WORKSPACE}/build
          ctest . \
            -LE slow \
            --timeout 600
      - name: re-run tests
        if: always() && (steps.run-ctest.outcome == 'failure')
        timeout-minutes: 60
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |-
          cd ${GITHUB_WORKSPACE}/build
          bash ${GITHUB_WORKSPACE}/.github/scripts/rerun-failed-tests.sh
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.profile == 'all' || inputs.profile == 'windows')
  act:
    # For available GitHub-hosted runners, see:

    # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (${{ matrix.compiler }} ${{ matrix.mpi }} MPI ${{ matrix.openmp }} OpenMP)
    strategy:
      # Allow other runners in the matrix to continue if some fail
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc]
        mpi: [with]
        openmp: [with]
        include:
          - os: ubuntu-24.04-arm
            compiler: gcc
            compiler-pkgs: "g++ gcc"
            cc: "gcc"
            cxx: "g++"
            mpi: with
            openmp: without
            openmp-cmake-flags: "-DWITH_OpenMP=OFF"
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: get CPU information
        run: lscpu
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: install dependencies
        run: |
          sudo apt -qq update
          sudo apt install -y ${{ matrix.compiler-pkgs }} cmake gfortran \
            libopenblas-dev \
            $([ "${{ matrix.mpi }}" == "with" ] && echo "libhypre-dev") \
            $([ "${{ matrix.mpi }}" == "with" ] && echo "libopenmpi-dev libmumps-dev libparmetis-dev") \
            $([ "${{ matrix.compiler }}" == "gcc" ] && echo "libsuitesparse-dev") \
            $([ "${{ matrix.compiler }}" == "gcc" ] && [ "${{ matrix.mpi }}" == "with" ] && echo "librocalution-dev") \
            $([ "${{ matrix.mpi }}" == "with" ] && echo "trilinos-all-dev libptscotch-dev") \
            $([ "${{ matrix.mpi }}" == "with" ] && echo "libnetcdff-dev")
      - name: configure
        # CHOLMOD and rocALUTION require a working OpenMP package. So, disable them for clang.

        run: |
          # work around error in the rocALUTION CMake config file distributed by Ubuntu
          if [ "${{ matrix.compiler }}" == "gcc" ] && [ "${{ matrix.mpi }}" == "with" ]; then
            sudo sed -i '/find_dependency(HIP)/d' /usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/cmake/rocalution/rocalution-config.cmake
          fi
          mkdir ${GITHUB_WORKSPACE}/build
          cd ${GITHUB_WORKSPACE}/build
          cmake \
            -DCMAKE_BUILD_TYPE="RelWithDebInfo" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/usr" \
            -DBLA_VENDOR="OpenBLAS" \
            ${{ matrix.openmp-cmake-flags }} \
            -DWITH_LUA=ON \
            $([ "${{ matrix.mpi }}" == "with" ] && echo "-DWITH_Zoltan=OFF" || echo "-DWITH_Zoltan=OFF") \
            $([ "${{ matrix.mpi }}" == "with" ] && echo "-DWITH_Mumps=OFF" || echo "-DWITH_Mumps=OFF") \
            $([ "${{ matrix.compiler }}" == "gcc" ] && echo "-DWITH_CHOLMOD=OFF" || echo "-DWITH_CHOLMOD=OFF") \
            $([ "${{ matrix.mpi }}" == "with" ] && echo "-DWITH_Hypre=OFF -DHYPRE_INCLUDE_DIR=/usr/include/hypre" || echo "-DWITH_Hypre=OFF") \
            $([ "${{ matrix.compiler }}" == "gcc" ] && [ "${{ matrix.mpi }}" == "with" ] && echo "-DWITH_ROCALUTION=OFF" || echo "-DWITH_ROCALUTION=OFF") \
            $([ "${{ matrix.mpi }}" == "with" ] && echo "-DWITH_ElmerIce=OFF" || echo "-DWITH_ElmerIce=OFF") \
            -DWITH_ELMERGUI=OFF \
            -DWITH_VTK=OFF \
            -DWITH_OCC=OFF \
            -DWITH_MATC=OFF \
            -DWITH_PARAVIEW=OFF \
            -DCREATE_PKGCONFIG_FILE=ON \
            $([ "${{ matrix.mpi }}" == "with" ] && echo "-DWITH_MPI=ON -DMPI_TEST_MAXPROC=2 -DMPIEXEC_PREFLAGS=--allow-run-as-root" || echo "-DWITH_MPI=OFF") \
            $([ "${{ matrix.mpi }}" == "with" ] && echo "-DWITH_Trilinos=OFF" || echo "-DWITH_Trilinos=OFF") \
            ..
      - name: build
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --build . -j$(nproc)
      - name: install
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --install .
      - name: check
        id: run-ctest
        timeout-minutes: 150
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |
          cd ${GITHUB_WORKSPACE}/build
          ctest . \
            -LE slow \
            -j$(nproc) \
            --timeout 300
      - name: Re-run tests
        if: always() && (steps.run-ctest.outcome == 'failure')
        timeout-minutes: 60
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |-
          cd ${GITHUB_WORKSPACE}/build
          bash ${GITHUB_WORKSPACE}/.github/scripts/rerun-failed-tests.sh
    if: github.event_name == 'workflow_dispatch' && (inputs.profile == 'all' || inputs.profile == 'act')
  full-gcc:
