            -DCMAKE_BUILD_TYPE="Release" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/usr" \
            -DBLA_VENDOR="OpenBLAS" \
            ${{ matrix.openmp-cmake-flags }} \
            -DWITH_LUA=ON \
            -DWITH_Zoltan=ON \
            -DWITH_Mumps=ON \
            -DWITH_Hypre=ON \
            -DHypre_INCLUDE_DIR="/usr/include/hypre" \
            -DWITH_ELMERGUI=ON \
            -DWITH_PARAVIEW=ON \
            -DWITH_ElmerIce=ON \
            -DCREATE_PKGCONFIG_FILE=ON \
            -DWITH_MPI=ON \
            -DMPI_TEST_MAXPROC=$(nproc) \
            -DMPIEXEC_PREFLAGS="--allow-run-as-root" \
            ..
      - name: build
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --build . -j$(nproc)
      - name: install
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --install .
      - name: check
        id: run-ctest
        timeout-minutes: 150
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |
          cd ${GITHUB_WORKSPACE}/build
          ctest . -j$(nproc) -L "parallel|fast"
      - name: re-run tests
        if: always() && (steps.run-ctest.outcome == 'failure')
        timeout-minutes: 60
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |-
          cd ${GITHUB_WORKSPACE}/build
          bash ${GITHUB_WORKSPACE}/.github/scripts/rerun-failed-tests.sh
