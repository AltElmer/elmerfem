name: Setup Windows MSYS2 Build Environment
description: Install ElmerFEM build dependencies on Windows via MSYS2 UCRT64

inputs:
  deps:
    description: 'Dependency strategy: external or bundled'
    required: true

runs:
  using: composite
  steps:
    - name: install MSYS2 and packages
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          base-devel
          git
        pacboy: >-
          cc:p
          fc:p
          cmake:p
          msmpi:p
          openblas:p
          parmetis:p
          mumps:p
          suitesparse:p
          qt6-declarative:p
          qwt-qt6:p
          vtk:p
          seacas:p
          exprtk:p
          nlohmann-json:p
          adios2:p
          anari-sdk:p
          boost:p
          cgns:p
          cli11:p
          eigen3:p
          fast_float:p
          ffmpeg:p
          gl2ps:p
          liblas:p
          libmariadbclient:p
          netcdf:p
          openslide:p
          openvdb:p
          pdal:p
          scnlib:p
          unixodbc:p
          utf8cpp:p
          opencascade:p
          ${{ inputs.deps == 'external' && 'parpack:p' || '' }}

    - name: install MSMPI
      uses: mpi4py/setup-mpi@v1
      with:
        mpi: msmpi
